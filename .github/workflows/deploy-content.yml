# Content publish to R2 (TRD §7.2) plus the sims, then the database half (content.* rows and the
# card index). Staging after a green Content workflow on main (it runs when content changes);
# production on a v* tag after the "production" environment's reviewers approve.
#   1. tools/content-publish --target r2: bundles, patches, media and manifests. Content-addressed
#      files are immutable; manifests have a 5-minute TTL, so no purge is needed. --env production
#      applies the release gate (content/releases.json): only released subjects and chapters are
#      built, their media must all be approved, and an empty gate refuses to publish. Staging
#      publishes everything, with media that is not approved yet shipped as unavailable.
#   2. python -m smriti_worker.content_apply: metadata.sql and the card index, on DATABASE_URL.
#   3. sims/*: built and synced to the assets bucket under sims/, which the CDN serves with
#      Cross-Origin-Resource-Policy: cross-origin (EXPO_PUBLIC_SIM_BASE_URL=https://cdn.<domain>/sims).
# Release order: the backend deploy migrates the schema; run this after it when a release has both.
# Skips (with a notice) while the environment lacks the R2 or database secrets.
name: Deploy content

on:
  workflow_run:
    workflows: [Content]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read
  actions: read

env:
  UV_VERSION: "0.11.32"
  PYTHON_VERSION: "3.12"

jobs:
  gate:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    uses: ./.github/workflows/deploy-gate.yml
    with:
      environment: ${{ inputs.environment || '' }}

  publish:
    name: Content and sims (${{ needs.gate.outputs.environment }})
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: ${{ needs.gate.outputs.environment }}
    concurrency:
      group: deploy-content-${{ needs.gate.outputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ needs.gate.outputs.environment }}
      R2_BUCKET_CONTENT: ${{ vars.R2_BUCKET_CONTENT }}
      R2_BUCKET_ASSETS: ${{ vars.R2_BUCKET_ASSETS }}
    steps:
      - name: Secrets present
        id: secrets
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          missing=""
          for name in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY DATABASE_URL R2_BUCKET_CONTENT R2_BUCKET_ASSETS; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::notice::not set for $ENVIRONMENT:$missing; skipping the content publish (docs/DEPLOY.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ needs.gate.outputs.sha }}
      - if: steps.secrets.outputs.ready == 'true'
        uses: pnpm/action-setup@v4.1.0
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - if: steps.secrets.outputs.ready == 'true'
        uses: astral-sh/setup-uv@v6.4.3
        with:
          version: ${{ env.UV_VERSION }}
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
      - if: steps.secrets.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.secrets.outputs.ready == 'true'
        run: uv sync --frozen --no-dev --package smriti-worker

      - name: Publish bundles, media and manifests to R2
        if: steps.secrets.outputs.ready == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          PUBLISH_ENV: ${{ needs.gate.outputs.environment }}
        run: |
          # The commit time fixes the publish time, so a re-run produces the same manifests.
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          pnpm --filter @smriti/content-publish exec tsx src/cli.ts --env "$PUBLISH_ENV" --target r2 --root content --report "$RUNNER_TEMP/publish"

      - name: Apply content metadata and the card index
        if: steps.secrets.outputs.ready == 'true'
        env:
          APP_ENV: ${{ needs.gate.outputs.environment }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: uv run --frozen --no-dev --package smriti-worker python -m smriti_worker.content_apply --report "$RUNNER_TEMP/publish" --root content

      - name: Build sims
        if: steps.secrets.outputs.ready == 'true'
        # The web app's copy step builds every sim, checks its licence, and writes sims/index.json.
        run: node apps/web/scripts/copy-sims.mjs

      - name: Sync sims to R2
        if: steps.secrets.outputs.ready == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          # Vite's hashed sim assets never change: cache them for a year.
          aws s3 sync apps/web/public/sims "s3://${R2_BUCKET_ASSETS}/sims" --endpoint-url "$endpoint" \
            --exclude "*" --include "*/assets/*" --cache-control "public, max-age=31536000, immutable" --only-show-errors
          # index.html, index.json and other unhashed files change in place: 5 minutes.
          aws s3 sync apps/web/public/sims "s3://${R2_BUCKET_ASSETS}/sims" --endpoint-url "$endpoint" \
            --exclude "*/assets/*" --cache-control "public, max-age=300" --only-show-errors

      - name: Report
        if: always() && steps.secrets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4.6.2
        with:
          name: content-publish-${{ needs.gate.outputs.environment }}
          path: ${{ runner.temp }}/publish/publish-report.json
          if-no-files-found: ignore
          retention-days: 30
