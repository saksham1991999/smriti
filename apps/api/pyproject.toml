[project]
name = "smriti-api"
version = "0.1.0"
description = "Smriti FastAPI service: config, catalogue, sync, accounts, gamification and the AI gateway"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.54",
  "asyncpg==0.32.0",
  "redis[hiredis]==5.3.1",
  "structlog==26.1.0",
  "pyjwt[crypto]==2.15.1",
  "cryptography==50.0.2",
  "httpx==0.28.1",
  "fsrs==6.3.2",
  "arq==0.28.0",
  "tzdata==2026.5",
  "opentelemetry-api==1.45.1",
  "opentelemetry-sdk==1.45.1",
  "opentelemetry-exporter-otlp-proto-http==1.45.1",
  "opentelemetry-instrumentation-fastapi==0.66b1",
  "opentelemetry-instrumentation-sqlalchemy==0.66b1",
  "opentelemetry-instrumentation-redis==0.66b1",
  "opentelemetry-instrumentation-httpx==0.66b1",
  "sentry-sdk==2.72.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "mypy==2.4.0",
  "ruff==0.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smriti_api"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint]
# `ruff format` owns line length; long SQL string literals are left on one line on purpose.
extend-ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S311", "S608"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["smriti_api", "tests"]

[[tool.mypy.overrides]]
module = ["arq.*", "fsrs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "live: calls a real external provider (skipped unless RUN_LIVE=1)",
]
