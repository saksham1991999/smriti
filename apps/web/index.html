<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Short, illustrated lessons and smart reviews for JEE, NEET, UPSC and school."
    />
    <link rel="icon" type="image/webp" href="/assets/logo-mark.webp" />
    <title>Smriti</title>
  </head>
  <body>
    <!-- ENT-01 on the web: the mark at 64 px on the page background until the first route renders. -->
    <div id="root">
      <div
        data-testid="ent-01"
        role="img"
        aria-label="Smriti"
        style="min-height: 100dvh; display: grid; place-items: center"
      >
        <img src="/assets/logo-mark.webp" alt="" width="64" height="64" />
      </div>
    </div>
    <noscript>Smriti needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
